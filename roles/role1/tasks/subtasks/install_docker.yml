---
- name: Установить Docker и Docker Compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: yes

- name: Запустить и включить службу Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Добавить пользователя в группу docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
